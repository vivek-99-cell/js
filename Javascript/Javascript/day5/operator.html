<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>


        //And
        console.log(6>2 && 2>3);

        console.log(2==2 && 7>3);

        //OR
        console.log(6>2 || 2>3);

        console.log(2==4 || 10>30);

        //Not

        console.log(!(6>2 || 5>4));

        //Unary operator

        let r=20;
        r++;
        console.log(r);


        let b=4;
        b--;
        console.log(b);

        let o=4;
        console.log(o++);

        let a=5;
        console.log(++a);

        let d=6;
        console.log(d--);

        let e=6;
        console.log(--e);

        //ternary operator

        let score=55;
        console.log(score>=40?"pass":"fail");

        let marks=34;
        console.log(marks>=40?"pass":"fail");

    </script>
</body>
</html>
