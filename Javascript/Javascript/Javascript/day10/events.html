<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="alertmessage()">submit</button>
     <button ondblclick="alertmessage()">double click</button>
    <button onmousedown="alertmessage()">mouse down</button>
    <button onmouseup="alertmessage()">mouse up</button>
    <button onmouseover="alertmessage()">mouse over</button>
    <button onmouseout="alertmessage()">mouse out</button> 

    <script>
        function alertmessage(){
            alert("button clicked");
        }
    </script>
</body>
</html>
