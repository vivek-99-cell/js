<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="checkbox" class="course">HTML<br>
    <input type="checkbox" class="course">CSS<br>
    <input type="checkbox" class="course">JavaScript<br>

    <button onclick="selectAll()">Select All</button>

    <script>
        function selectAll(){

            let courses = document.querySelectorAll(".course");

            courses.forEach(function(course){
                course.checked = true;
            });
        }
    </script>
</body>
</html>
